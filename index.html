<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

.card {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    margin: 0 auto;
    background: white;
    padding: 45px 25px 35px;
    text-align: center;
}

.profile {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 18px;
    border: 3px solid #222;
}

h1 {
    margin: 5px 0 8px;
    font-size: 28px;
    font-weight: 700;
}

.subtitle {
    margin: 0 0 30px;
    color: #666;
    font-size: 15px;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.button {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 54px;
    padding: 12px 18px;
    border-radius: 12px;
    text-decoration: none;
    color: #222;
    background: #f1f1f1;
    font-size: 16px;
    font-weight: 600;
    border: 1px solid #ddd;
    transition: transform 0.15s ease;
}

.button:active {
    transform: scale(0.98);
}

.icon {
    margin-right: 10px;
    font-size: 20px;
}

.footer {
    margin-top: 35px;
    font-size: 12px;
    color: #999;
}
